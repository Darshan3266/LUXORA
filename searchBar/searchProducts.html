<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="../productsStyles/product.css">

</head>

<body>



    <div class="boxCont color">
        <div class="boxProduct">
            <div class="btns">
                <img src="/assets/cart.png" id="cartBtn">
                <p id="home">Back to Home</p>

            </div>
            <img src="/assets/left sign.png" alt="" id="backBtn">

            <div class="imageCont">
                <div class="sidebar">
                    <img id="sideImg">
                </div>
                <div>
                    <img id="watchimage">
                    <img src="/assets/wish listlogo (5).png" alt="" id="wishBtn">
                </div>

            </div>

            <div class="containerBox bgColor">
                <div class="productDetails txtColor">
                    <image id="brand">
                        <h1 id="name"></h1>
                        <div id="ratingsList">
                            <p id="ratings"></p>
                            <p id="ratingsNo"></p>
                        </div>

                        <div>
                            <p id="price"></p>
                            <p id="taxTxt"></p>
                        </div>


                        <div class="contBox">
                            <!-- <img src="/assets/24-7.png" alt="" width="20px" height="20px"> -->
                            <div class="details">
                                <h4>Categories:</h4>
                                <h4>Collection:</h4>
                                <h4>Availability:</h4>

                            </div>
                            <div>
                                <h4 id="categories"></h4>
                                <h4 id="collection"></h4>
                                <h4 id="availability"></h4>
                            </div>

                        </div>

                        <div class="productBtns">

                            <p id="about"></p>
                            <div> <button id="addToCart"></button>
                                <button id="buyNow"></button>
                            </div>
                        </div>

                </div>
            </div>


        </div>

    </div>

    <div class="cardContainer">
        <div class="cardsBox">
            <div class="box">
                <img src="../assets/fast-delivery.png" alt="">
                <h3>FREE SHIPPING</h3>
                <p>Free world wide shipping on all orders.</p>
            </div>

            <div class="box">
                <img src="../assets/Quality.png" alt="">
                <h3>5 YEAR WARANTY</h3>
                <p>International warranty on all watches.</p>

            </div>

            <div class="box">
                <img src="/assets/cash delivery.png" alt="">
                <h3>CASH ON DELIVERY</h3>
                <p>Pay when you receive your order.</p>
            </div>

            <div class="box">
                <img src="/assets/secure payement.png" alt="">
                <h3>SECURE PAYMENT</h3>
                <p>100% secure payments guaranteed.</p>

            </div>
        </div>

        <div class="product" id="product">
            <div class="productInfo" id="productInfo">

            </div>
            <div class="productInfo1" id="productInfo1">

            </div>
        </div>
    </div>


    <div class="feedBackContainer">
           <div class="feedbackForm">
        <h1>Feedback Form</h1>
        <div class="feedbackDetails">

            <div class="inputsCont">
                <label for="">Name:</label>
                <input type="text" placeholder="Enter your Name" id="userName">
                <p id="errorMsg"></p>
            </div>

            <div class="ratingBtns">
                <div>

                    <img src="../assets/4star rating.png" alt="" class="star" data-value="1">
                    <img src="../assets/4star rating.png" alt="" class="star" data-value="2">
                    <img src="../assets/4star rating.png" alt="" class="star" data-value="3">
                    <img src="../assets/4star rating.png" alt="" class="star" data-value="4">
                    <img src="../assets/4star rating.png" alt="" class="star" data-value="5">
                    <div id="ratingsMsg"></div>
                </div>

            </div>
            <textarea name="feedBack" id="textBox" placeholder="Share your experience.(optional)"></textarea>

            <button type="submit" id="submitBtn">Submit</button>


        </div>

    </div>
    <div class="boxContainer">
        <div class="userBox" id="userBox"></div>
    </div>
    </div>
 


  







    <div class="productConts">

    </div>


    <div class="products">

    </div>

    <!-- <img src="/productsLists/products_assets/rolex_submariner1.png" alt=""> -->




    <script src="searchProducts.js"></script>
</body>

</html>
